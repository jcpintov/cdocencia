<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primer acceso | Cámara de Docencia</title>
<style>
body{background:#112235;color:#f4f5f6;font:17px Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
main{width:100%;max-width:530px;background:#20384e;border:1px solid #d4b078;border-radius:14px;padding:30px;box-sizing:border-box}
h1{font-size:1.6rem}p{line-height:1.5}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:6px;border:1px solid #aeb9c6}
button{background:#d4b078;color:#152538;border:0;border-radius:6px;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6;cursor:wait}a{color:#f1d3a0;font-weight:bold}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #f1d3a0}
[hidden]{display:none!important}#estado{min-height:1.5em;margin-top:15px}small{display:block;margin-top:8px;line-height:1.4}
</style></head><body><main><h1>Primer acceso a Cámara de Docencia</h1>
<p>Active su cuenta registrada mediante un código de ocho dígitos enviado a su correo. El código vence en 15 minutos.</p>
<form id="solicitud"><label for="correo">Correo electrónico registrado</label><input id="correo" name="correo" type="email" autocomplete="email" required maxlength="254">
<button type="submit">Enviar código</button></form>
<form id="confirmacion" hidden><label for="codigo">Código de ocho dígitos</label><input id="codigo" name="codigo" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required>
<label for="clave">Contraseña definitiva</label><input id="clave" name="clave" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<small>Mínimo 8 caracteres, al menos 6 letras o números y un símbolo.</small>
<label for="repetir">Repita su contraseña</label><input id="repetir" name="repetir" type="password" autocomplete="new-password" required>
<button type="submit">Activar cuenta</button></form>
<p id="estado" role="status" aria-live="polite"></p>
<p><a href="/">Volver a iniciar sesión</a></p></main>
<script>
'use strict';
const solicitar=document.getElementById('solicitud'), confirmar=document.getElementById('confirmacion'), estado=document.getElementById('estado');
async function enviar(payload,form){
 const btn=form.querySelector('button');btn.disabled=true;estado.textContent='Procesando solicitud…';
 try{
  const response=await fetch('/api/primer-acceso',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'No fue posible completar la operación');
  estado.textContent=data.mensaje||'Solicitud procesada';return true;
 }catch(error){estado.textContent=error.message||'Error de conexión';return false;}
 finally{btn.disabled=false;}
}
solicitar.addEventListener('submit',async event=>{
 event.preventDefault();const email=document.getElementById('correo').value.trim();
 if(await enviar({accion:'solicitar',email},solicitar))confirmar.hidden=false;
});
confirmar.addEventListener('submit',async event=>{
 event.preventDefault();
 const clave=document.getElementById('clave').value;
 if(clave!==document.getElementById('repetir').value){estado.textContent='Las contraseñas no coinciden';return;}
 if(clave.length<8||(clave.match(/[A-Za-z0-9]/g)||[]).length<6||!/[^A-Za-z0-9]/.test(clave)){estado.textContent='La contraseña no cumple los requisitos';return;}
 if(await enviar({accion:'confirmar',email:document.getElementById('correo').value.trim(),codigo:document.getElementById('codigo').value,clave},confirmar)){
 confirmar.hidden=true;solicitar.hidden=true;
 }
});
</script></body></html>
