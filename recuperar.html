<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Recuperar acceso de ensayo | Cámara de Docencia</title>
<style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#112235;color:#f3f2ef;font:16px system-ui,Arial,sans-serif;padding:16px;box-sizing:border-box}
main{width:min(480px,100%);box-sizing:border-box;padding:30px;background:#1d3348;border:1px solid #536477;border-radius:12px}h1{font-size:1.45rem}p{line-height:1.55}label{display:block;margin:18px 0 7px}input,button{width:100%;box-sizing:border-box;border-radius:7px;font:inherit;padding:12px}input{border:1px solid #9eacb8;background:#f8fafc;color:#162535}button{margin-top:20px;border:0;background:#d4b078;color:#172535;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}small{color:#d5dde5}#status{white-space:pre-wrap}a{color:#eed2a2}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body><main><h1>Configurar contraseña de ensayo</h1><p>Esta página gestiona únicamente una cuenta de Supabase Auth. No modifica las claves del portal institucional.</p>
<div id="waiting">Comprobando enlace de recuperación…</div>
<form id="form" hidden><label for="password">Nueva contraseña (mínimo 12 caracteres)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">Repetir contraseña</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button id="submit" type="submit">Establecer contraseña</button></form>
<p id="status" role="status" aria-live="polite"></p><small>Abre esta página desde el correo de recuperación. No compartas enlaces de recuperación ni contraseñas.</small></main>
<script>
'use strict';
const client=supabase.createClient('https://pwnnpjygnviyzyyvfxnq.supabase.co','sb_publishable_NExezuss4il3RPgO8Vifxw_pspbe5wF',{auth:{detectSessionInUrl:true,flowType:'implicit',persistSession:false}});
const status=document.getElementById('status'),form=document.getElementById('form'),waiting=document.getElementById('waiting');
let recoveryValidated=false;
function ready(){recoveryValidated=true;waiting.hidden=true;form.hidden=false;status.textContent='Enlace verificado. Introduce tu nueva contraseña.';}
client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')ready()});
(async()=>{const fragment=new URLSearchParams(location.hash.substring(1));const query=new URLSearchParams(location.search);if(fragment.get('error')||query.get('error')){waiting.hidden=true;status.textContent='El enlace no es válido o ha caducado. Solicita otro desde Supabase.';return;}
if(query.get('code')){const result=await client.auth.exchangeCodeForSession(query.get('code'));if(!result.error&&result.data.session)ready();else{waiting.hidden=true;status.textContent='No se pudo validar el enlace.';}return;}
const result=await client.auth.getSession();if(result.data.session&&fragment.get('type')==='recovery')ready();else if(!recoveryValidated){waiting.hidden=true;status.textContent='Para configurar una contraseña, abre el enlace de recuperación recibido por correo.';}})();
form.addEventListener('submit',async(e)=>{e.preventDefault();if(!recoveryValidated)return;const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;if(password!==confirm){status.textContent='Las contraseñas no coinciden.';return;}if(password.length<12){status.textContent='La contraseña debe contener al menos 12 caracteres.';return;}const button=document.getElementById('submit');button.disabled=true;const {error}=await client.auth.updateUser({password});document.getElementById('password').value='';document.getElementById('confirm').value='';button.disabled=false;if(error){status.textContent='No se pudo actualizar: '+error.message;return;}await client.auth.signOut();form.hidden=true;status.textContent='Contraseña configurada. Ya puedes acceder al laboratorio de autenticación.';});
</script></body></html>
