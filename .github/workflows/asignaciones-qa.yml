name: Interfaz, administración y DOCTRINA
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'app.js'
      - 'calendario-tenidas.js'
      - 'doctrina-admin.js'
      - 'perfil-superadmin.js'
      - 'api/admin-*.js'
      - 'api/cron-calendario*.js'
      - 'lib/correo-calendario.js'
      - 'lib/hora-calendario.js'
      - 'lib/extraer-doctrina.js'
      - 'lib/agente-doctrina.js'
      - 'lib/groq-doctrina.js'
      - 'sql/**'
      - 'package*.json'
      - 'tests/database/**'
      - 'api/admin-tenidas.js'
      - 'comentarios-hilos.js'
      - 'recuperar.html'
      - 'ui-v2.js'
      - 'index.html'
      - 'ui-v2.css'
      - 'styles.css'
      - 'asignaciones-admin.js'
      - 'informes-admin.js'
      - 'lib/informes-ejecutivos.js'
      - 'assets/fonts/**'
      - 'api/admin-asignaciones.js'
      - 'lib/correo-asignacion.js'
      - 'lib/correo-recordatorio.js'
      - 'lib/correo-publicacion.js'
      - 'lib/procesar-recordatorios.js'
      - 'api/cron-recordatorios.js'
      - 'vercel.json'
      - 'tests/browser/**'
      - '.github/workflows/asignaciones-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Instalar dependencias de la API sin scripts
        run: npm ci --ignore-scripts
      - name: Preparar navegador aislado sin secretos
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" --ignore-scripts --no-package-lock playwright@1.62.1 jsdom@30.1.3 @electric-sql/pglite@0.5.11 html2pdf.js@0.10.1
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Probar formulario y catálogo escritorio y móvil
        env:
          QA_PLAYWRIGHT_ROOT: ${{ runner.temp }}/qa
          QA_SQL_ROOT: ${{ runner.temp }}/qa
          QA_DOM_ROOT: ${{ runner.temp }}/qa
          QA_HILOS_CAPTURE: "1"
        run: |
          node tests/browser/informes-smoke.mjs
          node tests/browser/asignaciones-smoke.mjs
          node tests/browser/usuarios-smoke.mjs
          node tests/browser/tenidas-smoke.mjs
          node tests/browser/doctrina-smoke.mjs
          node tests/browser/plataforma-dom.mjs
          node tests/database/avance-smoke.mjs
          node tests/browser/orador-dom.mjs
          node tests/browser/memoria-casos-dom.mjs
          node tests/database/memoria-casos-smoke.mjs

