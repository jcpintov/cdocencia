name: Doctrina - Pruebas del núcleo privado
on:
  workflow_dispatch:
  push:
    branches: [feature/doctrina-ingesta-v1]
    paths:
      - 'doctrina/worker/**'
      - 'doctrina/superadmin/**'
      - 'doctrina/security/**'
      - 'index.html'
      - 'ui-v2.css'
      - 'styles.css'
      - '.github/workflows/doctrina-worker-tests.yml'
  pull_request:
    paths:
      - 'doctrina/worker/**'
      - 'doctrina/superadmin/**'
      - 'doctrina/security/**'
      - 'index.html'
      - 'ui-v2.css'
      - 'styles.css'
      - '.github/workflows/doctrina-worker-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r doctrina/worker/requirements.txt
      - name: Compilar
        run: python -m compileall -q doctrina/worker
      - name: Ejecutar pruebas
        run: python -m unittest discover -s doctrina/worker/tests -v
      - name: Pruebas estáticas de autorización heredada (sintéticas)
        run: python -m unittest discover -s doctrina/security/tests -v
      - name: Validar sintaxis de interfaz Superadmin
        run: |
          node --check doctrina/superadmin/floating-tab.js
          node --check doctrina/superadmin/bootstrap.js
          node --check doctrina/superadmin/auth-login.js
      - name: Pruebas de seguridad de Superadmin
        run: node --test doctrina/superadmin/tests/*.test.cjs
      - name: Validar sintaxis de componentes SMTP privados
        run: |
          node --check doctrina/security/smtp-ofl-adapter.cjs
          node --check doctrina/security/smtp-probe-preview.cjs
          node --check doctrina/security/smtp-probe-runner.cjs
      - name: Pruebas de contrato de recuperación de Docencia
        run: node --test doctrina/security/tests/*.test.cjs
